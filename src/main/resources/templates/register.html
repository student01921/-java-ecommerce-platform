<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register — E-Commerce</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body>

<!-- Light Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold text-dark mb-0" th:href="@{/}">
            <i class="bi bi-shop text-primary fs-4"></i>
            <span>E-Commerce</span>
        </a>
        <a th:href="@{/login}" class="btn btn-outline-secondary btn-sm ms-auto">
            <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card form-card p-2">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 48px; height: 48px;">
                            <i class="bi bi-person-plus fs-4"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Create an Account</h4>
                        <p class="text-secondary small mb-0">Join as a Buyer or Seller</p>
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post" novalidate>

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-medium text-secondary">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-secondary border-end-0">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" id="name" th:field="*{name}"
                                       class="form-control border-start-0 ps-1"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                       placeholder="John Doe" required>
                            </div>
                            <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-medium text-secondary">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-secondary border-end-0">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" id="email" th:field="*{email}"
                                       class="form-control border-start-0 ps-1"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       placeholder="name@store.com" required>
                            </div>
                            <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone" class="form-label small fw-medium text-secondary">Phone Number (optional)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-secondary border-end-0">
                                    <i class="bi bi-telephone"></i>
                                </span>
                                <input type="tel" id="phone" th:field="*{phone}"
                                       class="form-control border-start-0 ps-1"
                                       placeholder="e.g. 555-0100">
                            </div>
                        </div>

                        <!-- Role Selection -->
                        <div class="mb-3">
                            <label class="form-label small fw-medium text-secondary d-block">Account Type</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <div class="p-2 border rounded text-center bg-light">
                                        <div class="form-check d-flex align-items-center justify-content-center gap-2 mb-0">
                                            <input class="form-check-input" type="radio" th:field="*{role}" value="BUYER" id="roleBuyer">
                                            <label class="form-check-label fw-medium small" for="roleBuyer">
                                                <i class="bi bi-bag text-primary me-1"></i> Buyer
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="p-2 border rounded text-center bg-light">
                                        <div class="form-check d-flex align-items-center justify-content-center gap-2 mb-0">
                                            <input class="form-check-input" type="radio" th:field="*{role}" value="SELLER" id="roleSeller">
                                            <label class="form-check-label fw-medium small" for="roleSeller">
                                                <i class="bi bi-shop text-primary me-1"></i> Seller
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-medium text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-secondary border-end-0">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" id="password" th:field="*{password}"
                                       class="form-control border-start-0 ps-1"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                       placeholder="Minimum 6 characters" required>
                            </div>
                            <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label small fw-medium text-secondary">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-secondary border-end-0">
                                    <i class="bi bi-shield-lock"></i>
                                </span>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                                       class="form-control border-start-0 ps-1"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                       placeholder="Re-enter password" required>
                            </div>
                            <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-person-plus me-1"></i> Create Account
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top">
                        <small class="text-secondary">
                            Already have an account? <a th:href="@{/login}" class="text-primary text-decoration-none fw-medium">Login here</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white text-center text-muted py-3 border-top mt-auto">
    <div class="container">
        <small class="text-secondary">&copy; 2026 E-Commerce Platform. All rights reserved.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
