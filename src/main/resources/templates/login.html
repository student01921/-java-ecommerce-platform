<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — E-Commerce</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body>

<!-- Light Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold text-dark mb-0" th:href="@{/}">
            <i class="bi bi-shop text-primary fs-4"></i>
            <span>E-Commerce</span>
        </a>
        <a th:href="@{/register}" class="btn btn-outline-secondary btn-sm ms-auto">
            <i class="bi bi-person-plus me-1"></i> Register
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card form-card p-2">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 48px; height: 48px;">
                            <i class="bi bi-box-arrow-in-right fs-4"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Sign In</h4>
                        <p class="text-secondary small mb-0">Enter your credentials to continue</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${param.registered}" class="alert alert-success d-flex align-items-center gap-2 small py-2">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>Registration successful. Please log in.</span>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center gap-2 small py-2">
                        <i class="bi bi-info-circle-fill"></i>
                        <span>You have been logged out.</span>
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 small py-2">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>Invalid email or password.</span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <!-- Email Input Group -->
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-medium text-secondary">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-secondary border-end-0">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" id="email" name="email" class="form-control border-start-0 ps-1"
                                       placeholder="name@store.com" required autofocus>
                            </div>
                        </div>

                        <!-- Password Input Group -->
                        <div class="mb-4">
                            <label for="password" class="form-label small fw-medium text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-secondary border-end-0">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" id="password" name="password" class="form-control border-start-0 ps-1"
                                       placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top">
                        <small class="text-secondary">
                            Don't have an account? <a th:href="@{/register}" class="text-primary text-decoration-none fw-medium">Register here</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white text-center text-muted py-3 border-top mt-auto">
    <div class="container">
        <small class="text-secondary">&copy; 2026 E-Commerce Platform. All rights reserved.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
