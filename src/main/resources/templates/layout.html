<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle != null ? pageTitle + ' — E-Commerce' : 'E-Commerce Platform'}">E-Commerce Platform</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2">
    <div class="container-fluid px-4">
        <!-- Logo + Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold text-dark mb-0" th:href="@{/}">
            <i class="bi bi-shop text-primary fs-4"></i>
            <span>E-Commerce</span>
        </a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <!-- Nav Links -->
            <ul class="navbar-nav me-auto ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link text-secondary" th:href="@{/}">
                        <i class="bi bi-house me-1"></i> Home
                    </a>
                </li>

                <!-- Admin link -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-secondary" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Admin Dashboard
                    </a>
                </li>

                <!-- Seller link -->
                <li class="nav-item" sec:authorize="hasRole('SELLER')">
                    <a class="nav-link text-secondary" th:href="@{/seller/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Seller Dashboard
                    </a>
                </li>

                <!-- Buyer link -->
                <li class="nav-item" sec:authorize="hasRole('BUYER')">
                    <a class="nav-link text-secondary" th:href="@{/buyer/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Buyer Dashboard
                    </a>
                </li>
            </ul>

            <!-- Right-side actions -->
            <ul class="navbar-nav align-items-center gap-2">
                <!-- Anonymous -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link text-secondary" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-primary btn-sm" th:href="@{/register}">
                        <i class="bi bi-person-plus me-1"></i> Register
                    </a>
                </li>

                <!-- Authenticated User Avatar Dropdown -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2 p-1"
                       href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="avatar-circle">SP</span>
                        <span class="d-none d-md-inline small fw-medium text-dark" sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border mt-2">
                        <li class="px-3 py-2 border-bottom">
                            <div class="small text-muted">Signed in as</div>
                            <div class="small fw-semibold text-truncate" style="max-width: 180px;" sec:authentication="name">user@store.com</div>
                        </li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="p-1 mb-0">
                                <button type="submit" class="dropdown-item rounded d-flex align-items-center gap-2 text-danger small py-2">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ── Main Content ───────────────────────────────────── -->
<main>
    <div layout:fragment="content"></div>
</main>

<!-- ── Footer ─────────────────────────────────────────── -->
<footer class="bg-white text-center text-muted py-3 border-top mt-auto">
    <div class="container">
        <small class="text-secondary">&copy; 2026 E-Commerce Platform. All rights reserved.</small>
    </div>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
